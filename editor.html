<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Caption Editor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #161616; color: #eee;
    margin: 0; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    min-height: 100vh;
  }
  h1 { margin: 0; font-size: 20px; }
  h3 { margin: 0 0 8px; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
  a { color: #4a9eff; }

  button {
    padding: 8px 14px; background: #2a2a2a; color: #eee;
    border: 1px solid #444; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-family: inherit;
  }
  button:hover:not(:disabled) { background: #3a3a3a; border-color: #666; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: #1e5fb4; border-color: #2a7fd4; }
  button.primary:hover:not(:disabled) { background: #2a7fd4; }
  button.save { background: #2e5a1e; border-color: #4a8a2e; }
  button.save:hover:not(:disabled) { background: #3e7a2e; }

  .top-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .top-bar .spacer { flex: 1; }
  #status { font-size: 12px; color: #888; }

  #drop-zone {
    border: 2px dashed #444; border-radius: 8px;
    padding: 28px; text-align: center; color: #888;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  #drop-zone:hover { border-color: #666; color: #aaa; }
  body.dragging #drop-zone { border-color: #4a9eff; background: rgba(74,158,255,0.08); color: #fff; }
  body.dragging::after {
    content: 'Drop files or a folder';
    position: fixed; inset: 0;
    background: rgba(20,20,20,0.85);
    border: 3px dashed #4a9eff;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff; z-index: 1000;
    pointer-events: none;
  }

  #workspace {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 260px 1fr; gap: 12px;
  }

  #pair-list {
    background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 6px;
    overflow-y: auto; padding: 6px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .pair-item {
    padding: 8px 10px; border-radius: 4px; cursor: pointer;
    font-size: 13px; color: #ddd;
    display: flex; align-items: center; gap: 8px;
    border: 1px solid transparent;
  }
  .pair-item:hover { background: #262626; }
  .pair-item.active { background: #1e3a5f; border-color: #2a7fd4; color: #fff; }
  .pair-item .name {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pair-item .badge {
    flex-shrink: 0; font-size: 10px; padding: 1px 5px; border-radius: 3px;
    background: #333; color: #aaa; font-family: ui-monospace, monospace;
  }
  .pair-item .badge.missing { background: #5a2a1e; color: #ffb09a; }
  .pair-item .badge.dirty { background: #5a4a1e; color: #ffd28a; }

  #editor {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    min-height: 0;
  }
  .pane {
    background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 0; min-width: 0;
  }
  .pane-header {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #aaa;
  }
  .pane-header .filename {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #ddd; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  video {
    width: 100%; flex: 1; min-height: 0;
    background: #000; border-radius: 4px;
    object-fit: contain;
  }
  textarea {
    flex: 1; min-height: 0;
    background: #141414; color: #eee;
    border: 1px solid #333; border-radius: 4px;
    padding: 10px; font-size: 14px; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: none; outline: none;
  }
  textarea:focus { border-color: #4a9eff; }

  .nav-row {
    display: flex; align-items: center; gap: 8px;
  }
  .nav-row .counter {
    font-size: 12px; color: #888; font-family: ui-monospace, monospace;
  }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #666; font-style: italic;
  }

  kbd {
    background: #2a2a2a; border: 1px solid #444; border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 5px; font-family: ui-monospace, monospace;
    font-size: 11px;
  }
  .hint { color: #777; font-size: 12px; }

  @media (max-width: 900px) {
    #workspace { grid-template-columns: 1fr; }
    #editor { grid-template-columns: 1fr; }
    #pair-list { max-height: 200px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Video Caption Editor</h1>
  <span id="status"></span>
  <div class="spacer"></div>
  <a href="index.html">← Trimmer</a>
</div>

<div id="drop-zone">
  <div><strong>Drop a folder</strong> (or video + .txt files) here, or click to choose</div>
  <div class="hint" style="margin-top:6px">Each MP4 is paired with a same-named .txt caption file</div>
</div>
<input type="file" id="file-picker" accept="video/*,.txt,text/plain" multiple style="display:none">

<div id="workspace" style="display:none">
  <div id="pair-list"></div>

  <div id="editor">
    <div class="pane">
      <div class="pane-header">
        <span>Video:</span>
        <span class="filename" id="video-name">—</span>
      </div>
      <video id="video" controls preload="metadata"></video>
      <div class="nav-row">
        <button id="prev">← Prev</button>
        <button id="next">Next →</button>
        <span class="counter" id="counter">0 / 0</span>
        <div class="spacer" style="flex:1"></div>
        <span class="hint"><kbd>⌘/Ctrl</kbd>+<kbd>S</kbd> save · <kbd>⌘/Ctrl</kbd>+<kbd>↑/↓</kbd> nav</span>
      </div>
    </div>

    <div class="pane">
      <div class="pane-header">
        <span>Caption:</span>
        <span class="filename" id="txt-name">—</span>
        <button id="save" class="save" disabled>💾 Save</button>
      </div>
      <textarea id="caption" placeholder="Caption text…" spellcheck="true"></textarea>
    </div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);

const VIDEO_EXT = /\.(mp4|m4v|mov|webm|mkv|avi)$/i;
const TXT_EXT = /\.txt$/i;

const state = {
  pairs: [],
  index: -1,
  dirHandle: null,
};

function baseName(name) {
  return name.replace(/\.[^.]+$/, '');
}

function setStatus(msg) {
  $('status').textContent = msg || '';
}

async function pickFolder() {
  if (!window.showDirectoryPicker) {
    $('file-picker').click();
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await loadFromDirectory(handle);
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

async function loadFromDirectory(dirHandle) {
  state.dirHandle = dirHandle;
  const videos = new Map();
  const txts = new Map();
  for await (const entry of dirHandle.values()) {
    if (entry.kind !== 'file') continue;
    if (VIDEO_EXT.test(entry.name)) videos.set(baseName(entry.name), entry);
    else if (TXT_EXT.test(entry.name)) txts.set(baseName(entry.name), entry);
  }
  const pairs = [];
  for (const [base, vh] of videos) {
    const th = txts.get(base) ?? null;
    pairs.push({
      base,
      videoName: vh.name,
      txtName: th ? th.name : `${base}.txt`,
      videoHandle: vh,
      txtHandle: th,
      videoFile: null,
      captionText: null,
      originalText: null,
      dirty: false,
      missingTxt: !th,
    });
  }
  pairs.sort((a, b) => a.base.localeCompare(b.base));
  finishLoad(pairs, dirHandle.name);
}

function loadFromFiles(fileList) {
  state.dirHandle = null;
  const videos = new Map();
  const txts = new Map();
  for (const f of fileList) {
    if (VIDEO_EXT.test(f.name)) videos.set(baseName(f.name), f);
    else if (TXT_EXT.test(f.name)) txts.set(baseName(f.name), f);
  }
  const pairs = [];
  for (const [base, vf] of videos) {
    const tf = txts.get(base) ?? null;
    pairs.push({
      base,
      videoName: vf.name,
      txtName: tf ? tf.name : `${base}.txt`,
      videoHandle: null,
      txtHandle: null,
      videoFile: vf,
      txtFile: tf,
      captionText: null,
      originalText: null,
      dirty: false,
      missingTxt: !tf,
    });
  }
  pairs.sort((a, b) => a.base.localeCompare(b.base));
  finishLoad(pairs, `${pairs.length} pair${pairs.length === 1 ? '' : 's'}`);
}

function finishLoad(pairs, label) {
  if (!pairs.length) {
    setStatus('No MP4 files found.');
    return;
  }
  state.pairs = pairs;
  state.index = -1;
  $('workspace').style.display = 'grid';
  $('drop-zone').querySelector('div').innerHTML =
    `<strong>Loaded:</strong> ${label} — drop again to replace`;
  renderList();
  selectPair(0);
  const missing = pairs.filter(p => p.missingTxt).length;
  setStatus(`${pairs.length} video${pairs.length === 1 ? '' : 's'}` +
    (missing ? ` · ${missing} missing caption${missing === 1 ? '' : 's'}` : ''));
}

function renderList() {
  const list = $('pair-list');
  list.innerHTML = '';
  state.pairs.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'pair-item' + (i === state.index ? ' active' : '');
    item.onclick = () => selectPair(i);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = p.base;
    name.title = p.videoName;
    item.appendChild(name);
    if (p.dirty) {
      const b = document.createElement('span');
      b.className = 'badge dirty';
      b.textContent = '●';
      b.title = 'Unsaved changes';
      item.appendChild(b);
    }
    if (p.missingTxt) {
      const b = document.createElement('span');
      b.className = 'badge missing';
      b.textContent = 'new';
      b.title = 'No .txt yet — will be created on save';
      item.appendChild(b);
    }
    list.appendChild(item);
  });
}

async function maybeConfirmDirty() {
  const cur = state.pairs[state.index];
  if (cur && cur.dirty) {
    return confirm(`"${cur.base}" has unsaved changes. Discard them?`);
  }
  return true;
}

async function selectPair(i) {
  if (i < 0 || i >= state.pairs.length) return;
  if (i !== state.index && !(await maybeConfirmDirty())) return;
  state.index = i;
  const p = state.pairs[i];

  if (!p.videoFile && p.videoHandle) {
    p.videoFile = await p.videoHandle.getFile();
  }
  const video = $('video');
  if (video.src) URL.revokeObjectURL(video.src);
  video.src = URL.createObjectURL(p.videoFile);
  $('video-name').textContent = p.videoName;
  $('txt-name').textContent = p.txtName + (p.missingTxt ? ' (new)' : '');

  if (p.captionText == null) {
    let text = '';
    try {
      if (p.txtHandle) text = await (await p.txtHandle.getFile()).text();
      else if (p.txtFile) text = await p.txtFile.text();
    } catch (e) {
      console.error('Failed to read caption:', e);
    }
    p.captionText = text;
    p.originalText = text;
  }
  $('caption').value = p.captionText;
  updateDirty();
  $('counter').textContent = `${i + 1} / ${state.pairs.length}`;
  renderList();
}

function updateDirty() {
  const p = state.pairs[state.index];
  if (!p) return;
  p.captionText = $('caption').value;
  const wasDirty = p.dirty;
  p.dirty = p.captionText !== p.originalText;
  $('save').disabled = !p.dirty && !p.missingTxt;
  if (wasDirty !== p.dirty) renderList();
}

async function savePair(p) {
  if (state.dirHandle) {
    if (!p.txtHandle) {
      p.txtHandle = await state.dirHandle.getFileHandle(p.txtName, { create: true });
    }
    const writable = await p.txtHandle.createWritable();
    await writable.write(p.captionText);
    await writable.close();
  } else {
    const blob = new Blob([p.captionText], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = p.txtName;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
  }
  p.originalText = p.captionText;
  p.dirty = false;
  p.missingTxt = false;
  $('save').disabled = true;
  renderList();
  setStatus(`Saved ${p.txtName}`);
  setTimeout(() => {
    if ($('status').textContent === `Saved ${p.txtName}`) setStatus('');
  }, 2000);
}

$('drop-zone').onclick = () => pickFolder();
$('file-picker').onchange = e => {
  if (e.target.files.length) loadFromFiles(e.target.files);
};

$('caption').addEventListener('input', updateDirty);

$('save').onclick = async () => {
  const p = state.pairs[state.index];
  if (!p) return;
  try { await savePair(p); }
  catch (e) {
    console.error(e);
    alert('Save failed: ' + e.message);
  }
};

$('prev').onclick = () => selectPair(state.index - 1);
$('next').onclick = () => selectPair(state.index + 1);

let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if (!e.dataTransfer?.types?.includes('Files')) return;
  e.preventDefault();
  dragDepth++;
  document.body.classList.add('dragging');
});
window.addEventListener('dragover', e => {
  if (!e.dataTransfer?.types?.includes('Files')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('dragleave', e => {
  if (!e.dataTransfer?.types?.includes('Files')) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) document.body.classList.remove('dragging');
});
window.addEventListener('drop', async e => {
  if (!e.dataTransfer?.types?.includes('Files')) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');

  const items = e.dataTransfer.items;
  if (items && items.length && items[0].getAsFileSystemHandle) {
    const handle = await items[0].getAsFileSystemHandle();
    if (handle && handle.kind === 'directory') {
      try { await handle.requestPermission?.({ mode: 'readwrite' }); } catch {}
      await loadFromDirectory(handle);
      return;
    }
  }
  const files = [...e.dataTransfer.files];
  if (files.length) loadFromFiles(files);
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  const inText = tag === 'TEXTAREA' || (tag === 'INPUT' && e.target.type !== 'file');
  const mod = e.metaKey || e.ctrlKey;

  if (mod && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    $('save').click();
    return;
  }
  if (mod && e.key === 'ArrowUp') { e.preventDefault(); selectPair(state.index - 1); return; }
  if (mod && e.key === 'ArrowDown') { e.preventDefault(); selectPair(state.index + 1); return; }
  if (inText) return;
  if (e.key === 'ArrowUp') { e.preventDefault(); selectPair(state.index - 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); selectPair(state.index + 1); }
});

window.addEventListener('beforeunload', e => {
  if (state.pairs.some(p => p.dirty)) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>

</body>
</html>
